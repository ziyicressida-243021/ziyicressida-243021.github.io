<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox3</title>

    <style>
        body {
            background-color: rgb(120, 120, 77);

        }

        .main {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-left: 50px;
            padding-right: 50px;

        }

        .bar {
            display: flex;
            gap: 20px;
        }


        .request {
            background-color: rgb(255, 255, 255);
            border: rgb(0, 0, 0) solid;
            border-width: 2px;
            color: rgb(0, 0, 0);
            text-decoration: none;
            padding: 10px 35px;
            border-radius: 8px;
            font-size: 17px;
        }

        .right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 50px;
            font-size: 20px;
        }

        .main2 {
            display: flex;
            background-color: white;
        }

        .illu img {
            width: 600px;
        }

        .paragraph {
            font-size: 20px;
        }

        p {
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div>
        <div class="main">
            <div class="logo"><img src="image/logo.png">
            </div>

            <div class="right">
                <div class="bar">
                    <p1>About us</p1>
                    <p2>Services</p2>
                    <p3>Use Cases</p3>
                    <p4>Pricing</p4>
                    <p5>Blog</p5>
                </div>

                <div>
                    <a class="request" href="https://www.goodreads.com/quotes">Request a quote</a>
                </div>
            </div>
        </div>
        <div class="main2">
            <div class="paragraph">
                <h1>Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO, PPC, social media marketing, and content creation.</p>
            </div>
            <div class="illu">
                <img src="image/illu.png" alt="picture">
            </div>
        </div>
    </div>


</body>

</html>
