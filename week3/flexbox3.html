<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox3</title>

    <style>
        body {
            background-color: rgb(120, 120, 77);
            font-family: "Space Grotesk", sans-serif;
            margin-top: 51px;
        }

        .main {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-left: 100px;
            padding-right: 100px;

        }

        .bar {
            display: flex;
            gap: 40px;
        }


        .request {
            color: black;
            border: rgb(0, 0, 0) solid;
            border-width: 1px;
            text-decoration: none;
            padding: 10px 35px;
            border-radius: 14px;
            font-size: 17px;
        }

        .right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 50px;
            font-size: 20px;
        }

        .main2 {
            display: flex;
            justify-content: space-between;
            background-color: white;
            padding: 100px 100px;
            gap: 200px;
        }


        .illu img {
            width: 600px;
            display: block;
        }

        .paragraph {
            font-size: 60px;
        }

        p {
            font-size: 20px;

        }

        .consultation {
            background-color: black;
            border: black solid;
            border-width: 2px;
            border-radius: 14px;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            gap: 10px;

        }

        .bottom {
            margin-top: 51px;
            display: flex;
            justify-content: space-between;
            background-color: white;
            gap: 100px;
        }
    </style>
</head>

<body>
    <div>
        <div class="main">
            <div class="logo"><img src="image/logo.png">
            </div>

            <div class="right">
                <div class="bar">
                    <p1>About us</p1>
                    <p2>Services</p2>
                    <p3>Use Cases</p3>
                    <p4>Pricing</p4>
                    <p5>Blog</p5>
                </div>

                <div>
                    <a class="request" href="https://www.goodreads.com/quotes">Request a quote</a>
                </div>
            </div>
        </div>
        <div class="main2">
            <div class="paragraph">
                <h1>Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO, PPC, social media marketing, and content creation.</p>
                <div>
                    <a class="consultation" href="https://knapsackcreative.com/best-consulting-websites">Book a
                        consultation</a>
                </div>
            </div>
            <div class="illu">
                <img src="image/illu.png" alt="picture">
            </div>
        </div>
        <div class="bottom">
            <img src="image/logo1.png" alt="amazon">
            <img src="image/logo2.png" alt="drillle">
            <img src="image/logo3.png" alt="hubspot">
            <img src="image/logo4.png" alt="notion">
            <img src="image/logo5.png" alt="netflix">
            <img src="image/logo6.png" alt="zoom">
        </div>

    </div>





</body>

</html>
