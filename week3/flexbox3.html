<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox3</title>
    <style>
        .main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bar {
            display: flex;
            gap: 20px;
        }

        .request {
            background-color: rgb(255, 255, 255);
            border: rgb(0, 0, 0);
            border-color: black;
            color: rgb(0, 0, 0);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="logo"><img src="image/logo.png" alt="">
        </div>
        <div>
            <div class="bar">
                <p1>About us</p1>
                <p2>Services</p2>
                <p3>Use Cases</p3>
                <p4>Pricing</p4>
                <p5>Blog</p5>
            </div>
        </div>

        <div>
            <a class="request" href="https://www.goodreads.com/quotes">Request a quote</a>
        </div>
    </div>

</body>

</html>
