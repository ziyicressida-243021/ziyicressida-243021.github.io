<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #b8b8b8;
            display: flex;
            flex-direction: column;
            gap: 20px;
            font-family: "Oxygen", sans-serif;

        }

        .dailou {
            display: flex;
            background-color: white;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;

        }

        .dailou.div {
            padding: 30px 30px;
        }

        .hamburger img {
            width: 23px;
        }

        .logo img {
            width: 120px;
        }

        .dailou2 {
            display: flex;
            background-color: white;
            align-items: center;
            justify-content: space-between;
            padding: 10px 30px;
            gap: 30px;

        }

        .dailou2.div {
            display: flex;
            align-items: center;
            padding: 30px 30px;
            font-size: 16px;

        }

        .right {
            display: flex;
            align-items: center;
        }

        .call {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-weight: bold;
        }

        .call img {
            width: 23px;
        }

        .hamburger {
            margin-left: 15px;
        }

        .dailou3.content {
            gap: 10px;
        }

        .contact {
            background-color: red;
            border: red;
            color: rgb(255, 255, 255);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;

        }

        .dailou3 {
            display: flex;
            background-color: white;
            align-items: center;
            justify-content: space-between;
            padding: 10px 30px;
            gap: 30px;
        }

        .dailou3.div {
            display: flex;
            align-items: center;
            padding: 30px 30px;
            font-size: 16px;
        }

        .content {
            display: flex;
            gap: 30px;
        }

        p2 {
            color: red;

        }

        p {
            margin: 0px;
            padding: 0px;

        }
    </style>
</head>

<body>

    <div class="dailou">
        <div class="logo"><img src="image/ele.png">
        </div>
        <div class="hamburger"><img src="image/hamburger.png">
        </div>
    </div>

    <div class="dailou2">
        <div class="logo"><img src="image/ele.png">
        </div>
        <div class="right">
            <div class="call"><img src="image/call.png">
                <p>555-123-4567</p>
            </div>
            <div class="hamburger"><img src="image/hamburger.png">
            </div>
        </div>
    </div>

    <div class="dailou3">
        <div class="logo"><img src="image/ele.png">
        </div>

        <div class="content">
            <p1>Home</p1>
            <p2>Services</p2>
            <p3>Work</p3>
            <p4>Project Details</p4>
            <p5>Contact</p5>
        </div>

        <div class="call"><img src="image/call.png">
            <p>555-123-4567</p>
            <a class="contact" href="https://www.shopee.com">Contact</a>
        </div>
    </div>

</body>

</html>
