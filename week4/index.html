<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header {
            background-color: darkslategrey;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
        }

        .sociallinks {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo h1 {
            color: white;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
        }

        .profilepicture img {
            width: 180px;
        }

        .name h1 {
            text-align: center;
        }

        .name h2 {
            font-size: 25px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <h1>logo</h1>
        </div>
        <div class="sociallinks">
            <div class="twitter"></div>
            <a href="https://www.lazada.com" target="_blank">
                <img src="image/twitter.png" alt="twitter" width="30" height="30">
            </a>

            <a href="https://www.tiktok.com" target="_blank">
                <img src="image/tik-tok (1).png" alt="tiktok" width="30" height="30">
            </a>

            <a href="https://www.instagram.com" target="_blank">
                <img src="image/instagram (3).png" alt="instagram" width="30" height="30">
            </a>
        </div>

    </div>
    <div class="content">
        <div class="profilepicture">
            <img src="image/profilepic.png" alt="profilepicture">
        </div>
        <div class="name">
            <h1>Chin Zi Yi</h1>
            <h2>Web Publishing</h2>
        </div>
    </div>
</body>

</html>
