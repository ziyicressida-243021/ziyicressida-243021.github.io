<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu.html</title>
    <style>
        body {
            background-color: rgb(197, 202, 239);
            font-family: Arial, sans-serif;

        }

        .firstbar {
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            gap: 30px;

        }

        .rightside {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .call img {
            width: 23px;
            max-width: 100%;
        }

        .logo img {
            width: 180px;
            max-width: 100%;
        }

        .contactbutton {
            background-color: #f9612b;
            border: #f9612b;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 7px;
            max-width: 100%;
        }

        .content {
            display: flex;
            gap: 30px;
            max-width: 100%;
        }

        .hambuger img {
            width: 23px;
            max-width: 100%;
            display: none;
        }

        @media screen and (max-width: 1020px) {
            .firstbar {
                font-size: 15px;

            }

            .content {
                display: none;
            }

            .contactbutton {
                display: none;
            }

            .hambuger img {
                display: block;
            }

        }

        @media screen and (max-width: 750px) {
            .call img {
                display: none;
            }

            .number {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="firstbar">
        <div class="logo"><img src="image/ele.png" alt="logo">
        </div>
        <div class="content">
            <p1>Home</p1>
            <p2>Services</p2>
            <p3>Work</p3>
            <p4>Project Details</p4>
            <p5>Contact</p5>
        </div>

        <div class="rightside">
            <div class="call"><img src="image/call.png" alt="call">
            </div>
            <div class="number">
                <p>555-123-4567</p>
            </div>
            <div class="contactbutton"><a class="contactbutton"
                    href="https://dictionary.cambridge.org/dictionary/english/contact">Contact</a>
            </div>
            <div class="hambuger"><img src="image/hamburger.png" alt="hambuger">
            </div>

        </div>
    </div>
</body>

</html>
