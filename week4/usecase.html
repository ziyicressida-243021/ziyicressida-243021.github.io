<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usecase.html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Oxygen:wght@300;400;700&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">

</head>
<style>
    body {
        font-size: 20px;
        font-family: "Space Grotesk", sans-serif;

    }

    .toppanel {
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 50px;
    }

    .rightside {
        display: flex;
        align-items: center;
        gap: 40px;
    }

    .content {
        display: flex;
        align-items: center;
        gap: 40px;
    }

    .requestbutton {
        display: flex;
        align-items: center;
        color: #191A23;
        border: rgb(0, 0, 0) solid;
        border-width: 1px;
        text-decoration: none;
        padding: 20px 35px;
        border-radius: 14px;

    }

    .hambuger img {
        display: none;
        width: 20px;
        max-width: 100%;
    }

    p3 {
        border: #B9FF66 solid;
        background-color: #B9FF66;

    }
</style>

<body>
    <div>
        <div class="toppanel">
            <div class="logo"><img src="image/logo.png" alt="logo">
            </div>
            <div class="rightside">
                <div class="content">
                    <p1>About us</p1>
                    <p2>Services</p2>
                    <p3>Use Cases</p3>
                    <p4>Pricing</p4>
                    <p5>Blog</p5>
                </div>

                <div class="requestbutton">
                    <a class="request" href="https://www.goodreads.com/quotes">Request a quote</a>
                </div>

                <div class="hambuger"><img src="image/hamburger.png" alt="hambuger"></div>
            </div>
        </div>
    </div>

</body>

</html>
