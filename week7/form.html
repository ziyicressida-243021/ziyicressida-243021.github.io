<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form.html</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <div class="heading">
        <h1>Registeration Form-Middle School</h1>
    </div>
    <div class="namesection">
        <form action="#">
            <div class="all">
                <div class="section1">
                    <div class="firstname">
                        <input type="text" id="fname" name="fname" placeholder="First name*" required>
                    </div>

                    <div class="lastname">
                        <input type="text" id="lname" name="lname" placeholder="Last name*">
                        <br>
                    </div>
                </div>
                <div class="section2">
                    <div class="birthdate"><br>
                        <input type="date" id="birthday" name="birthday" required>
                        <br>
                    </div>

                    <div class="email">
                        <br>
                        <input type="email" id="email" name="email" placeholder="Email*" required><br>
                    </div>
                </div>
                <div class="section3">
                    <div class="homeurl">
                        <br>
                        <input type="url" id="url" name="homepageurl" placeholder="Home Page*" required><br>
                    </div>

                    <div class="favouritecolor">
                        <br>
                        <input type="text" id="color" name="color" placeholder="Favourite Colors*">
                        <br>
                    </div>
                </div>
            </div>
            <div class="selfintro">
                <p><label for="selfintroduction">Self Introduction*</label></p>
                <textarea name="selfintroduction" rows="10" cols="50"></textarea>
                <br>
            </div>

            <div class="submitbutton">
                <br>
                <input type="submit" value="submit">
            </div>
        </form>
    </div>
</body>

</html>
